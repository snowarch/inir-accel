[workspace]
resolver = "3"
members = [
    "crates/inir-core",
    "crates/inir-accel",
    "crates/inir-qml-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
authors = ["Hikari"]

[workspace.dependencies]
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff"] }
toml = { version = "0.8", features = ["preserve_order"] }
libc = "0.2"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"
