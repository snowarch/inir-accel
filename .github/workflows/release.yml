name: release

# The binary setup fetches: built on the oldest glibc people run, so it starts on all of them. PRs build it too.
# One build per arch on its own runner (the tests run natively there too), one job publishes them all.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked -p inir-core -p inir-accel
      - name: package
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "inir-accel") | .version')
          if [[ $GITHUB_REF == refs/tags/* && ${GITHUB_REF_NAME#v} != "$ver" ]]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $ver"; exit 1
          fi
          name=inir-accel-$ver-${{ matrix.arch }}
          cargo build --release --locked -p inir-accel
          mkdir -p "out/$name"
          cp target/release/inir-accel LICENSE LICENSE-GPL "out/$name/"
          tar -C out -cf - "$name" | gzip -9 -n > "out/$name.tar.gz"
          (cd out && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: inir-accel-${{ matrix.arch }}
          path: |
            out/*.tar.gz
            out/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: inir-accel-*
          path: out
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" out/*.tar.gz out/*.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
